[project]
name = "visa-merchant-backend"
version = "0.1.0"
description = "Merchant backend — catalog upload, raw-row storage, merchant config"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas>=2.0",
    # Merchants keep catalogs in spreadsheets; see app/tabular.py.
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
