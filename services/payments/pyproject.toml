[project]
name = "visa-payments"
version = "0.1.0"
description = "Mock Visa payment service — preview, authorize, confirm, and the ledger"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "asyncpg>=0.31",
    "pydantic>=2.13",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
